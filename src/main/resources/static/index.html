<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Catalog | Block Edition</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;500;700&display=swap');

:root {
  --verde: #65c934;
  --verde-escuro: #347c1c;
  --painel: rgba(28, 27, 30, .96);
  --borda: #55515a;
  --texto: #f4f0e8;
  --secundario: #c4c0cc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--texto);
  font-family: Roboto, Arial, sans-serif;
  background-color: #17191b;
  background-image:
    linear-gradient(rgba(10, 14, 10, .58), rgba(10, 12, 12, .82)),
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.035) 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.035) 40px),
    linear-gradient(135deg, #254a27, #53613a 35%, #242a38 70%, #17191b);
  background-attachment: fixed;
}

.world-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(90deg, transparent 48%, #000 49% 51%, transparent 52%),
    linear-gradient(transparent 48%, #000 49% 51%, transparent 52%);
  background-size: 80px 80px;
}

.topo {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  padding: 35px 20px 28px;
  text-align: left;
  border-bottom: 7px solid #4b9829;
  background: linear-gradient(180deg, rgba(18, 23, 35, .75), rgba(18, 23, 35, .18));
}

.logo { font-size: 62px; filter: drop-shadow(4px 5px 0 #111); }

.topo h1 {
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(22px, 4vw, 42px);
  line-height: 1.5;
  color: #f4f1e8;
  text-shadow: 4px 4px 0 #151515, 6px 6px 0 #000;
}

.topo p { margin: 5px 0 0; color: #e1e0e8; font-size: 17px; }

.container { position: relative; width: min(1120px, calc(100% - 32px)); margin: 28px auto; }

.painel {
  background: var(--painel);
  border: 5px solid #39363c;
  border-top: 8px solid #4c982b;
  box-shadow: 0 9px 0 rgba(0,0,0,.38), inset 0 0 0 2px rgba(255,255,255,.04);
  padding: 24px;
}

h2 {
  margin: 0 0 22px;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(13px, 2vw, 18px);
  line-height: 1.8;
  text-shadow: 2px 2px #000;
}

.bloco-icone { color: #78d447; margin-right: 8px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px 20px; }

label { display: flex; flex-direction: column; gap: 9px; font-weight: 700; }

input, textarea {
  width: 100%;
  padding: 14px;
  color: white;
  background: #17171b;
  border: 2px solid #625d68;
  border-radius: 5px;
  outline: none;
  font: 15px Roboto, Arial, sans-serif;
}

input:focus, textarea:focus { border-color: var(--verde); box-shadow: 0 0 0 2px rgba(101,201,52,.18); }
input::placeholder, textarea::placeholder { color: #9994a3; }
textarea { resize: vertical; }
.campo-largo { grid-column: 1 / -1; }

.acoes { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 18px; }

button {
  border: 0;
  cursor: pointer;
  font-weight: 700;
  color: white;
  background: linear-gradient(#75d83b, #39951e);
  padding: 14px 22px;
  border-radius: 3px;
  box-shadow: 0 5px 0 #246515, 0 7px 12px rgba(0,0,0,.3);
  text-shadow: 1px 2px #245515;
  transition: transform .12s, filter .12s;
}

button:hover { filter: brightness(1.12); transform: translateY(-1px); }
button:active { transform: translateY(3px); box-shadow: 0 2px 0 #246515; }
button:disabled { opacity: .6; cursor: wait; }

#mensagem { margin: 0; font-weight: 700; }
.sucesso { color: #8be64d; }
.erro { color: #ff7777; }

.secao-jogos { margin-top: 38px; }
.titulo-lista { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
.titulo-lista h2 { margin-bottom: 18px; }
.botao-atualizar { padding: 10px 16px; margin-bottom: 18px; }

.lista-jogos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

.card {
  overflow: hidden;
  background: rgba(29, 27, 31, .97);
  border: 4px solid #514c55;
  box-shadow: 0 6px 0 rgba(0,0,0,.4);
}

.card-imagem {
  display: block;
  height: 155px;
  object-fit: cover;
  background: linear-gradient(135deg, #345b2c, #20242b);
  border-bottom: 4px solid #514c55;
}

.card-imagem-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 155px;
  font-size: 42px;
  background: linear-gradient(135deg, #345b2c, #20242b);
  border-bottom: 4px solid #514c55;
}

.card-faixa {
  height: 8px;
  background: repeating-linear-gradient(90deg, #5bb72f 0 18px, #438e25 18px 36px);
}

.card-conteudo { padding: 17px; }
.card h3 { margin: 0 0 13px; color: #a4ed73; font-size: 20px; overflow-wrap: anywhere; }
.card p { margin: 8px 0; color: var(--secundario); line-height: 1.45; overflow-wrap: anywhere; }
.card .descricao { padding-top: 8px; border-top: 1px solid #48434c; color: #e5e1e8; }

.estado { color: var(--secundario); grid-column: 1 / -1; padding: 10px 0; }
footer { position: relative; text-align: center; color: #c2bdc6; padding: 20px; font-size: 13px; }
footer span { color: var(--verde); padding: 0 6px; }

@media (max-width: 650px) {
  .topo { flex-direction: column; text-align: center; gap: 8px; }
  .logo { font-size: 44px; }
  .form-grid { grid-template-columns: 1fr; }
  .campo-largo { grid-column: auto; }
  .painel { padding: 17px; }
  .titulo-lista { align-items: flex-start; }
}

  </style>

</head>
<body>
  <div class="world-overlay"></div>

  <header class="topo">
    <div class="logo">🎮</div>
    <div>
      <h1>GAME CATALOG</h1>
      <p>Explore, cadastre e jogue seus games favoritos!</p>
    </div>
  </header>

  <main class="container">
    <section class="painel cadastro">
      <h2><span class="bloco-icone">▦</span> Cadastrar novo jogo</h2>

      <form id="formJogo">
        <div class="form-grid">
          <label>
            Nome do jogo
            <input type="text" id="nome" placeholder="Ex.: Minecraft" required>
          </label>

          <label>
            Gênero
            <input type="text" id="genero" placeholder="Ex.: Aventura" required>
          </label>

          <label>
            Plataforma
            <input type="text" id="plataforma" placeholder="Ex.: PC, Console, Mobile" required>
          </label>

          <label>
            Ano de lançamento
            <input type="number" id="anoLancamento" placeholder="Ex.: 2011"
                   min="1950" max="2100" required>
          </label>

          <label class="campo-largo">
            URL da imagem de capa
            <input type="url" id="imagem" placeholder="https://exemplo.com/imagem-do-jogo.jpg">
          </label>

          <label class="campo-largo">
            Descrição
            <textarea id="descricao" rows="3" placeholder="Conte um pouco sobre o jogo..."></textarea>
          </label>
        </div>

        <div class="acoes">
          <button type="submit" id="btnCadastrar">✚ Cadastrar jogo</button>
          <p id="mensagem" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="secao-jogos">
      <div class="titulo-lista">
        <h2><span class="bloco-icone">▦</span> Jogos cadastrados</h2>
        <button type="button" class="botao-atualizar" id="btnAtualizar">↻ Atualizar</button>
      </div>
      <div id="listaJogos" class="lista-jogos">
        <p class="estado">Carregando jogos...</p>
      </div>
    </section>
  </main>

  <footer>GAME CATALOG <span>•</span> Seu mundo de jogos começa aqui.</footer>
  <script>
// Altere este endereço caso sua API utilize outra URL.
const API_URL = "http://localhost:8080/api/jogos";

const formJogo = document.getElementById("formJogo");
const listaJogos = document.getElementById("listaJogos");
const mensagem = document.getElementById("mensagem");
const btnCadastrar = document.getElementById("btnCadastrar");

// GET: consulta os jogos cadastrados na API.
async function listarJogos() {
  listaJogos.innerHTML = '<p class="estado">Buscando jogos na API...</p>';

  try {
    const resposta = await fetch(API_URL);

    if (!resposta.ok) {
      throw new Error(`Erro HTTP: ${resposta.status}`);
    }

    const jogos = await resposta.json();
    listaJogos.innerHTML = "";

    if (!Array.isArray(jogos) || jogos.length === 0) {
      listaJogos.innerHTML = '<p class="estado">Nenhum jogo cadastrado ainda. Que tal adicionar o primeiro?</p>';
      return;
    }

    jogos.forEach((jogo) => {
      const card = document.createElement("article");
      card.className = "card";

      const imagemUrl = jogo.imagem;
      let areaImagem;

      if (imagemUrl) {
        areaImagem = document.createElement("img");
        areaImagem.className = "card-imagem";
        areaImagem.src = imagemUrl;
        areaImagem.alt = `Capa do jogo ${jogo.nome ?? ""}`;
        areaImagem.loading = "lazy";
        areaImagem.onerror = () => {
          const placeholder = document.createElement("div");
          placeholder.className = "card-imagem-placeholder";
          placeholder.textContent = "🎮";
          areaImagem.replaceWith(placeholder);
        };
      } else {
        areaImagem = document.createElement("div");
        areaImagem.className = "card-imagem-placeholder";
        areaImagem.textContent = "🎮";
      }

      const faixa = document.createElement("div");
      faixa.className = "card-faixa";

      const conteudo = document.createElement("div");
      conteudo.className = "card-conteudo";

      const nome = document.createElement("h3");
      nome.textContent = `🎮 ${jogo.nome ?? "Jogo sem nome"}`;

      const genero = document.createElement("p");
      genero.textContent = `⛏ Gênero: ${jogo.genero ?? "-"}`;

      const plataforma = document.createElement("p");
      plataforma.textContent = `🕹 Plataforma: ${jogo.plataforma ?? "-"}`;

      const ano = document.createElement("p");
      ano.textContent = `📅 Lançamento: ${jogo.anoLancamento ?? "-"}`;

      const descricao = document.createElement("p");
      descricao.className = "descricao";
      descricao.textContent = jogo.descricao || "Sem descrição cadastrada.";

      conteudo.append(nome, genero, plataforma, ano, descricao);
      card.append(areaImagem, faixa, conteudo);
      listaJogos.appendChild(card);
    });
  } catch (erro) {
    console.error("Erro ao buscar jogos:", erro);
    listaJogos.innerHTML = '<p class="estado erro">Não foi possível carregar os jogos. Verifique se a API está em execução.</p>';
  }
}

// POST: envia os dados do formulário para a API.
formJogo.addEventListener("submit", async (event) => {
  event.preventDefault();

  const jogo = {
    nome: document.getElementById("nome").value.trim(),
    genero: document.getElementById("genero").value.trim(),
    plataforma: document.getElementById("plataforma").value.trim(),
    anoLancamento: Number(document.getElementById("anoLancamento").value),
    descricao: document.getElementById("descricao").value.trim(),
    imagem: document.getElementById("imagem").value.trim()
  };

  mensagem.textContent = "Enviando cadastro...";
  mensagem.className = "";
  btnCadastrar.disabled = true;

  try {
    const resposta = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(jogo)
    });

    if (!resposta.ok) {
      const detalhe = await resposta.text();
      throw new Error(detalhe || `Erro HTTP: ${resposta.status}`);
    }

    mensagem.textContent = "✔ Jogo cadastrado com sucesso!";
    mensagem.className = "sucesso";
    formJogo.reset();

    // Atualiza a tela para mostrar o jogo recém-cadastrado.
    await listarJogos();
  } catch (erro) {
    console.error("Erro ao cadastrar jogo:", erro);
    mensagem.textContent = "✖ Não foi possível cadastrar. Verifique os dados e a API.";
    mensagem.className = "erro";
  } finally {
    btnCadastrar.disabled = false;
  }
});

// Botão para executar o GET novamente.
document.getElementById("btnAtualizar").addEventListener("click", listarJogos);

// Ao abrir a página, busca os jogos automaticamente.
listarJogos();

  </script>
</body>
</html>
